[package]
name = "z-verified-actions"
version = "0.1.0"
edition = "2021"
description = "Append-only, offline-verifiable action ledger for enterprise agents in a T3N TEE. A 2xx is not evidence; only an independent read-back confirms."
license = "MIT"
publish = false

# cdylib makes the wasm32-wasip2 target emit a WASM *component*. "lib" is kept so
# the record/state logic stays unit-testable natively with `cargo test`.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
